name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests + skill-drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the test suite (tests/*.sh)
        run: |
          fail=0
          for t in tests/*.sh; do
            echo "::group::$t"
            bash "$t" || fail=1
            echo "::endgroup::"
          done
          exit $fail
      - name: Codex skills are in sync with commands/ + reference/
        run: python3 bin/build-codex-skills.py --check
      - name: Python scripts compile
        run: python3 -m py_compile bin/*.py
